<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Zadatak 4</title>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <style>
        /* Stilovi preuzeti točno iz priručnika */
        .node circle {
            fill: #fff;
            stroke: steelblue;
            stroke-width: 1.5px;
        }
        .node {
            font: 10px sans-serif;
            cursor: pointer;
        }
        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 1.5px;
        }
    </style>
</head>
<body>
    <script>
        // Podaci preuzeti izravno iz priručnika (Slika 4.4 / Stranica 60)
        var data = {
            "name": "flare",
            "children": [
                {
                    "name": "analytics",
                    "children": [
                        {
                            "name": "cluster",
                            "children": [
                                {"name": "AgglomerativeCluster", "size": 3938},
                                {"name": "CommunityStructure", "size": 3812},
                                {"name": "MergeEdge", "size": 743}
                            ]
                        },
                        {
                            "name": "graph",
                            "children": [
                                {"name": "BetweennessCentrality", "size": 3534},
                                {"name": "LinkDistance", "size": 5731}
                            ]
                        }
                    ]
                }
            ]
        };

        var width = 800, height = 500;
        var i = 0;

        var tree = d3.layout.tree().size([height, width - 160]);
        var diagonal = d3.svg.diagonal().projection(function(d) { return [d.y, d.x]; });

        var svg = d3.select("body").append("svg")
            .attr("width", width).attr("height", height)
            .append("g")
            .attr("transform", "translate(80,0)");

        var root = data;
        update(root);

        function update(source) {
            var nodes = tree.nodes(root).reverse();
            var links = tree.links(nodes);

            nodes.forEach(function(d) { d.y = d.depth * 180; });

            var node = svg.selectAll("g.node")
                .data(nodes, function(d) { return d.id || (d.id = ++i); });

            var nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", function(d) { return "translate(" + d.y + "," + d.x + ")"; })
                .on("click", click); // Ovdje registriramo klik za skrivanje

            nodeEnter.append("circle").attr("r", 4.5);

            nodeEnter.append("text")
                .attr("x", function(d) { return d.children || d._children ? -10 : 10; })
                .attr("dy", ".35em")
                .attr("text-anchor", function(d) { return d.children || d._children ? "end" : "start"; })
                .text(function(d) { return d.name; });

            // Prijelaz (update) pozicija čvorova
            var nodeUpdate = node.attr("transform", function(d) { return "translate(" + d.y + "," + d.x + ")"; });
            
            // Boja kruga se mijenja ako čvor ima skrivenu djecu
            nodeUpdate.select("circle")
                .style("fill", function(d) { return d._children ? "lightsteelblue" : "#fff"; });

            node.exit().remove();

            // Iscrtavanje veza (linkova)
            var link = svg.selectAll("path.link")
                .data(links, function(d) { return d.target.id; });

            link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", diagonal);

            link.attr("d", diagonal);
            link.exit().remove();
        }

        // Funkcija za prebacivanje djece (skrivanje/prikaz)
        function click(d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }
    </script>
</body>
</html>
