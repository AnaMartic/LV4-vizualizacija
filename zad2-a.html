<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadatak 2a - Tekst izvan kružnice</title>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <style>
        .arc text { 
            font-family: sans-serif; 
            font-size: 12px; 
            fill: black; 
        }
        .arc path {
            stroke: #fff;
            stroke-width: 1px;
        }
    </style>
</head>
<body>
    <script>
        var data = [
            {voce: "Jabuke", kolicina: 17},
            {voce: "Kruške", kolicina: 4},
            {voce: "Banana", kolicina: 83},
            {voce: "Jagoda", kolicina: 47},
            {voce: "Ribizla", kolicina: 1}
        ];

        var width = 600, height = 600, radius = 200;
        var color = d3.scale.category10();

        // Luk za crtanje segmenata
        var arc = d3.svg.arc()
            .outerRadius(radius)
            .innerRadius(0);

        // NOVO: Poseban luk za pozicioniranje teksta IZVAN (npr. radius + 40)
        var labelArc = d3.svg.arc()
            .outerRadius(radius + 40)
            .innerRadius(radius + 40);

        var pie = d3.layout.pie().value(function(d) { return d.kolicina; });

        var svg = d3.select("body").append("svg")
            .attr("width", width).attr("height", height)
            .append("g")
            .attr("transform", "translate(" + width/2 + "," + height/2 + ")");

        var arcs = svg.selectAll("g.arc")
            .data(pie(data))
            .enter()
            .append("g")
            .attr("class", "arc");

        // 1. Crtanje segmenata (kriški)
        arcs.append("path")
            .attr("fill", function(d, i) { return color(i); })
            .attr("d", arc);

        // 2. Dodavanje teksta IZVAN kružnice
        arcs.append("text")
            .attr("transform", function(d) { 
                // Koristimo labelArc umjesto običnog arc za izračun pozicije
                return "translate(" + labelArc.centroid(d) + ")"; 
            })
            .attr("text-anchor", function(d) {
                var midAngle = d.startAngle + (d.endAngle - d.startAngle) / 2;
                return (midAngle < Math.PI) ? "start" : "end";
            })
            .text(function(d) { 
                return d.data.voce + ": " + d.data.kolicina; 
            });
    </script>
</body>
</html>
