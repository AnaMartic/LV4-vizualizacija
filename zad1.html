<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Zadatak 3</title>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <style>
        .arc text {
            font-family: sans-serif;
            font-size: 12px;
            fill: white;
        }
    </style>
</head>
<body>
    <div id="grafikon"></div>

    <script>
        // 1. PODACI
        var data = [
            {voce: "Jabuke", kolicina: 20},
            {voce: "Kruške", kolicina: 40},
            {voce: "Šljive", kolicina: 50},
            {voce: "Dinje", kolicina: 80},
            {voce: "Lubenice", kolicina: 30},
            {voce: "Breskve", kolicina: 10}
        ];

        // 2. DIMENZIJE
        var width = 400;
        var height = 400;
        var outerRadius = width / 2;
        var innerRadius = 0; // 0 za kružni prikaz (Pie chart)

        // 3. POSTAVKE BOJA I LUKOVA
        var color = d3.scale.category10();

        var arc = d3.svg.arc()
            .innerRadius(innerRadius)
            .outerRadius(outerRadius);

        var pie = d3.layout.pie()
            .value(function(d) { return d.kolicina; });

        // 4. KREIRANJE SVG ELEMENTA
        var svg = d3.select("#grafikon")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // 5. ISCRTAVANJE SEGMENATA
        var arcs = svg.selectAll("g.arc")
            .data(pie(data))
            .enter()
            .append("g")
            .attr("class", "arc")
            .attr("transform", "translate(" + outerRadius + "," + outerRadius + ")");

        arcs.append("path")
            .attr("fill", function(d, i) { return color(i); })
            .attr("d", arc);

        // 6. DODAVANJE TEKSTA - RJEŠENJE 1. ZADATKA
        arcs.append("text")
            .attr("transform", function(d) { 
                return "translate(" + arc.centroid(d) + ")"; 
            })
            .attr("text-anchor", "middle")
            .text(function(d) { 
                // Ovdje spajamo naziv voća i količinu
                return d.data.voce + ": " + d.data.kolicina; 
            });
    </script>
</body>
</html>
